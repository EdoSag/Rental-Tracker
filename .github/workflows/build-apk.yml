name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with sample data (3 months, 4 tenants)
        run: flutter test

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=rental
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets are missing; building a test APK signed with a temporary debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          SUFFIX=$([ "${{ steps.signing.outputs.signed }}" = "true" ] && echo "" || echo "-TEST-debug-signed")
          NAME="rental-tracker-${VERSION}-build${{ github.run_number }}${SUFFIX}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish release (signed builds only)
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          name: ניהול שכירות ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.apk.outputs.name }}
          make_latest: true
